[package]
name = "win-opie"
version = "1.4.0"
description = "Native Windows 11 replica of Opie radial utility"
authors = ["WinOpie Team"]
edition = "2021"

[lib]
name = "win_opie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "bmp"] }
winreg = "0.52"
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Security",
    "Media_Control",
    "Storage_Streams"
]
